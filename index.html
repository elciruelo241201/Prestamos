<style>
:root{
  --bg:#f2f4f8; --card:#fff; --ink:#14213d; --muted:#6b7488; --line:#e4e8ef;
  --brand:#123c52; --brand2:#1d6a7a; --accent:#f2b705;
  --g:#1f9d55; --gbg:#e2f5ea; --y:#d99a00; --ybg:#fff4d1; --r:#e03131; --rbg:#fde6e6;
  --gray:#9aa3b5; --graybg:#eef0f4; --pur:#7a4fd6; --purbg:#efe9fc; --blue:#2f6fd6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Encabezado */
.hero{background:linear-gradient(150deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 0 74px;border-radius:0 0 28px 28px}
.hero h1{font-size:21px;font-weight:800}
.hero p{opacity:.8;font-size:14px;margin-top:2px}
.gear{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);font-size:20px;display:grid;place-items:center;flex:none}
.big{margin-top:18px}
.big small{font-size:12.5px;opacity:.85;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.big div{font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-52px}

.stat small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat b{display:block;font-size:16.5px;margin-top:4px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Resumen semáforo */
.sem3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sbtn{background:var(--card);border-radius:14px;padding:10px;display:flex;align-items:center;gap:9px;border:2px solid transparent;box-shadow:0 2px 8px rgba(20,33,61,.05);text-align:left}
.sbtn.on{border-color:var(--c)}
.sbtn i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 4px var(--cb)}
.sbtn b{font-size:19px;display:block;line-height:1}
.sbtn span{font-size:11.5px;color:var(--muted);font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.section{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:18px 4px 10px}

.tl{display:inline-flex;gap:5px;background:#1d2433;padding:5px 7px;border-radius:999px;flex:none}
.tl i{width:13px;height:13px;border-radius:50%;opacity:.22}

/* Tarjeta */

/* Hojas */
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{margin-top:10px}

.dhead{border-radius:18px;padding:16px;background:var(--cb)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.dl b{display:block;font-size:16.5px;color:var(--ink)}
.dl .s b{color:var(--c)}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}

.it .t{flex:1;min-width:0}
.it .t b{font-size:15px}
.it .t div{font-size:12.5px;color:var(--muted)}
.it .m{font-weight:800;text-align:right}
.it .m small{display:block;font-size:11.5px;font-weight:700}
.del{color:var(--muted);font-size:17px;padding:4px 6px}
.more{width:100%;text-align:center;font-size:13.5px;font-weight:700;color:var(--brand2);padding:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--k);vertical-align:-1px}
.share{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.imgprev{width:100%;border-radius:16px;box-shadow:0 6px 20px rgba(20,33,61,.15);display:block}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:fade .2s;max-width:90vw;text-align:center}
.banner{background:var(--ybg);color:#7a5600;font-size:13.5px;font-weight:600;padding:12px 14px;border-radius:12px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{background:var(--accent);padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;flex:none}

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ============ CONFIGURACIÓN ============ */
const DIAS_AMARILLO = 2;   // días antes de un pago para ponerse en amarillo
const KEY = 'prestamos-familia-v2';

/* ============ ALMACENAMIENTO (solo en este dispositivo) ============ */
let state={prestamos:[],ultimoRespaldo:null};
try{ const s=localStorage.getItem(KEY); if(s){ const o=JSON.parse(s); if(o&&Array.isArray(o.prestamos)) state=o; } }catch(e){}
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
let storageOK=true;
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); storageOK=true; }catch(e){ storageOK=false; } }

let filtro='Todos', filtroEst=null;
const $app=document.getElementById('app');

/* ============ UTILIDADES ============ */
const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return d+' '+MESES[m-1]+' '+y; };
const fshort=s=>{ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return d+' '+MESES[m-1]; };
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const hoy=()=>{ const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); };
const dias=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const finMes=(y,m)=>new Date(y,m,0).getDate();
const addDays=(s,n)=>{ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d.getFullYear(),d.getMonth()+1,d.getDate()); };
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#123c52','#7a4fd6','#d65a8a','#2f6fd6','#c9711e','#0f8a7a','#a63d40','#3d5a80'];
const colorDe=n=>{ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const nombre1=n=>n.trim().split(/\s+/)[0];

const FREQ={
  semanal:{t:'Semanal',cada:'cada semana',per:'semana',mes:12/52},
  quincenal:{t:'Quincenal',cada:'cada quincena',per:'quincena',mes:0.5},
  mensual:{t:'Mensual',cada:'cada mes',per:'mes',mes:1},
  unico:{t:'Pago único',cada:''}
};
const VENT={semanal:3,quincenal:7,mensual:15}; // un abono cubre el pago que vence dentro de estos días
const INT={ninguno:{t:'Sin interés',c:'Ninguno'},total:{t:'% total',c:'% total'},mensual:{t:'% mensual',c:'% mes'},anual:{t:'% anual',c:'% año'},fijo:{t:'Cantidad fija',c:'$ fijo'}};
const SEM={
  ok :{t:'Al corriente',l:'g',c:'var(--g)',cb:'var(--gbg)',hex:'#1f9d55',hexbg:'#e2f5ea'},
  pv :{t:'Por vencer',  l:'y',c:'var(--y)',cb:'var(--ybg)',hex:'#d99a00',hexbg:'#fff4d1'},
  ven:{t:'Vencido',     l:'r',c:'var(--r)',cb:'var(--rbg)',hex:'#e03131',hexbg:'#fde6e6'},
  liq:{t:'Liquidado',   l:'g',c:'var(--g)',cb:'var(--gbg)',hex:'#1f9d55',hexbg:'#e2f5ea'},
  sin:{t:'Sin fecha',   l:'', c:'var(--gray)',cb:'var(--graybg)',hex:'#9aa3b5',hexbg:'#eef0f4'}
};

/* ============ CALENDARIO DE PAGOS ============ */
function genFechas(tipo,inicio,n){
  const out=[]; if(!inicio||!n) return out;
  const [y,m,d]=inicio.split('-').map(Number);
  if(tipo==='semanal'){ for(let i=0;i<n;i++) out.push(addDays(inicio,7*i)); }
  else if(tipo==='mensual'){
    const fin=d>=finMes(y,m);
    for(let i=0;i<n;i++){ const mm=((m-1+i)%12)+1, yy=y+Math.floor((m-1+i)/12), ld=finMes(yy,mm); out.push(iso(yy,mm,fin?ld:Math.min(d,ld))); }
  } else if(tipo==='quincenal'){
    let a,b,empB,finB;
    if(d>15){ b=d; a=d-15; empB=true; finB=d>=finMes(y,m)||d>=30; } else { a=d; b=d+15; empB=false; finB=b>=30; }
    let yy=y, mm=m, first=true;
    while(out.length<n){
      const ld=finMes(yy,mm);
      if(!(first&&empB)) out.push(iso(yy,mm,Math.min(a,ld)));
      if(out.length<n) out.push(iso(yy,mm,finB?ld:Math.min(b,ld)));
      first=false; mm++; if(mm>12){mm=1;yy++;}
    }
  }
  return out.slice(0,n);
}

/* ============ CÁLCULOS ============ */
function mesesPlazo(p){
  const pl=p.plan||{tipo:'unico'};
  if(pl.tipo==='unico') return pl.inicio&&p.fecha?Math.max(0,dias(p.fecha,pl.inicio))/30.4167:0;
  return (pl.n||0)*FREQ[pl.tipo].mes;
}
function interesDe(monto,it,meses){
  if(!it||it.tipo==='ninguno') return 0;
  const v=Number(it.valor)||0;
  if(it.tipo==='total') return r2(monto*v/100);
  if(it.tipo==='mensual') return r2(monto*v/100*meses);
  if(it.tipo==='anual') return r2(monto*v/100*meses/12);
  if(it.tipo==='fijo') return r2(v);
  return 0;
}
const AMORT=t=>t==='mensual'||t==='anual';   // interés sobre saldo (como tabla de amortización)
function tasaPeriodo(tipoPlan,it){ const v=(Number(it.valor)||0)/100; return (it.tipo==='anual'?v/12:v)*FREQ[tipoPlan].mes; }
function amort(P,i,cuota){
  if(!(cuota>0)) return null;
  const out=[]; let s=r2(P);
  for(let k=0;k<1200&&s>0.005;k++){
    const int=r2(s*i);
    if(cuota<=int+0.005) return null;
    if(s+int<=cuota+0.005){ out.push({monto:r2(s+int),cap:s,int}); s=0; }
    else { const cap=r2(cuota-int); out.push({monto:r2(cuota),cap,int}); s=r2(s-cap); }
  }
  return s>0.005?null:out;
}
function cuotaFrancesa(P,i,n){ return i<=0?Math.ceil(P/n*100)/100:Math.ceil(P*i/(1-Math.pow(1+i,-n))*100)/100; }
/* Cada pago = capital + interés */
function cuotasDe(p){
  const pl=p.plan||{tipo:'unico'}, it=p.interes||{tipo:'ninguno'}, P=r2(p.monto);
  if(pl.tipo==='unico'){ const I=interesDe(P,it,mesesPlazo(p)); return [{n:1,fecha:pl.inicio||'',monto:r2(P+I),cap:P,int:I}]; }
  let rows;
  if(AMORT(it.tipo)){
    const i=tasaPeriodo(pl.tipo,it);
    rows=amort(P,i,r2(pl.cuota))||amort(P,i,cuotaFrancesa(P,i,Math.max(1,pl.n|0)))||[{monto:P,cap:P,int:0}];
  } else {
    const n=Math.max(1,pl.n|0), I=interesDe(P,it,0), total=r2(P+I); let c=r2(pl.cuota);
    if(!(c>0)||c*(n-1)>=total) c=r2(total/n);
    const ii=r2(I/n); rows=[];
    for(let k=0;k<n;k++){ const last=k===n-1, monto=last?r2(total-c*(n-1)):c, int=last?r2(I-ii*(n-1)):ii; rows.push({monto,int,cap:r2(monto-int)}); }
  }
  const f=genFechas(pl.tipo,pl.inicio,rows.length);
  return rows.map((r,k)=>({n:k+1,fecha:f[k]||'',...r}));
}
function calc(p){
  const H=hoy();
  const prog=!!(p.plan&&p.plan.tipo!=='unico');
  const meses=mesesPlazo(p);
  /* Reparto de cada abono (en orden de fecha):
     1) pagos vencidos + el pago que vence pronto (monto pactado completo)
     2) lo que sobra va a CAPITAL de los últimos pagos: su interés desaparece y el préstamo termina antes */
  let cuotas, interes, aCapital=0, ahorro=0;
  const falta=c=>r2(c.monto-c.pagado-c.capx-c.perd);
  const abs=[...(p.abonos||[])].map((a,i)=>({...a,_i:i})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||a._i-b._i);
  if(prog&&AMORT(p.interes&&p.interes.tipo)){
    /* Interés SOBRE SALDO (como tabla de amortización / banco):
       el interés de cada pago se calcula con el capital que realmente se debe.
       Lo abonado de más baja el capital al momento → el interés siguiente baja y el plazo se acorta. */
    const i=tasaPeriodo(p.plan.tipo,p.interes), P=r2(p.monto);
    let C=r2(p.plan.cuota); if(!amort(P,i,C)) C=cuotaFrancesa(P,i,Math.max(1,p.plan.n|0));
    const base=amort(P,i,C)||[];
    interes=r2(base.reduce((s,c)=>s+c.int,0));
    const F=genFechas(p.plan.tipo,p.plan.inicio,Math.min(1200,base.length+2));
    cuotas=[]; let S=P;
    const gen=()=>{ const int=r2(S*i); let monto,cap; if(S+int<=C+0.005){ monto=r2(S+int); cap=S; } else { monto=C; cap=r2(C-int); } S=r2(S-cap);
      cuotas.push({n:cuotas.length+1,fecha:F[cuotas.length]||'',monto,cap,int,pagado:0,capx:0,perd:0}); };
    for(const a of abs){
      const lim=a.fecha?addDays(a.fecha,VENT[p.plan.tipo]):'9999';
      while(S>0.005&&cuotas.length<1200&&(F[cuotas.length]||'9999')<=lim) gen();
      let rest=r2(a.monto);
      for(const c of cuotas){ if(rest<=0.005) break; const f=falta(c); if(f<=0.005) continue; const pg=Math.min(rest,f); c.pagado=r2(c.pagado+pg); rest=r2(rest-pg); }
      if(rest>0.005&&S>0.005){ const pg=Math.min(rest,S); S=r2(S-pg); rest=r2(rest-pg); aCapital=r2(aCapital+pg); }
    }
    while(S>0.005&&cuotas.length<1200) gen();
    ahorro=Math.max(0,r2(interes-cuotas.reduce((s,c)=>s+c.int,0)));
  } else {
    /* Interés fijo (% total o $ fijo) repartido en los pagos, o sin interés:
       lo abonado de más cubre el capital de los ÚLTIMOS pagos y su interés desaparece. */
    cuotas=cuotasDe(p).map(c=>({...c,pagado:0,capx:0,perd:0}));
    interes=r2(cuotas.reduce((s,c)=>s+c.int,0));
    for(const a of abs){
      let rest=r2(a.monto);
      const lim=prog&&a.fecha?addDays(a.fecha,VENT[p.plan.tipo]):null;
      for(const c of cuotas){
        if(rest<=0.005) break;
        if(lim&&c.fecha&&c.fecha>lim) break;
        const f=falta(c); if(f<=0.005) continue;
        const pg=Math.min(rest,f); c.pagado=r2(c.pagado+pg); rest=r2(rest-pg);
      }
      if(rest>0.005&&prog){
        for(let i=cuotas.length-1;i>=0&&rest>0.005;i--){
          const c=cuotas[i]; if(falta(c)<=0.005) continue;
          if(c.pagado>0.005) break;
          const capRest=r2(c.cap-c.capx); if(capRest<=0.005) continue;
          const pg=Math.min(rest,capRest); c.capx=r2(c.capx+pg); c.perd=c.cap>0?r2(c.int*c.capx/c.cap):0;
          rest=r2(rest-pg); aCapital=r2(aCapital+pg);
        }
      }
      if(rest>0.005) for(const c of cuotas){ const f=falta(c); if(f>0.005){ const pg=Math.min(rest,f); c.pagado=r2(c.pagado+pg); rest=r2(rest-pg); } }
    }
    ahorro=r2(cuotas.reduce((s,c)=>s+c.perd,0));
  }
  cuotas.forEach(c=>{
    c.falta=falta(c); const cub=r2(c.pagado+c.capx);
    if(c.falta<=0.005){ c.falta=0; c.e=(c.capx>0.005&&c.pagado<=0.005)?'capital':'pagado'; }
    else if(c.fecha&&c.fecha<H) c.e='vencido';
    else if(c.fecha&&dias(H,c.fecha)<=DIAS_AMARILLO) c.e='porvencer';
    else if(cub>0) c.e='parcial';
    else c.e='pendiente';
  });
  const total=r2(p.monto+interes-ahorro);
  const abonado=r2((p.abonos||[]).reduce((s,a)=>s+Number(a.monto||0),0));
  const saldo=Math.max(0,r2(cuotas.reduce((s,c)=>s+c.falta,0)));
  const pct=total>0?Math.min(100,abonado/total*100):0;
  // Cuánto se necesita HOY para liquidar (el interés de los pagos futuros desaparece)
  const limHoy=prog?addDays(H,VENT[p.plan.tipo]):null;
  const payoff=r2(cuotas.reduce((s,c)=>{ if(c.falta<=0) return s; if(!prog||c.pagado>0.005||(c.fecha&&c.fecha<=limHoy)) return s+c.falta; return s+r2(c.cap-c.capx); },0));
  const venc=cuotas.filter(c=>c.e==='vencido');
  const atrasado=r2(venc.reduce((s,c)=>s+c.falta,0));
  const sig=cuotas.find(c=>c.falta>0.005&&c.e!=='vencido');
  const pagadas=cuotas.filter(c=>c.e==='pagado'||c.e==='capital').length;
  const pend=cuotas.filter(c=>c.falta>0.005);
  const fechaFin=pend.length?pend[pend.length-1].fecha:'';

  let k, due;
  if(saldo<=0){ k='liq'; due='✅ ¡Pagado completo!'; }
  else if(atrasado>0.005){
    k='ven';
    const d0=-dias(H,venc[0].fecha);
    due=prog?'🔴 Debe '+fmt(atrasado)+' atrasado ('+venc.length+(venc.length===1?' pago':' pagos')+')':'🔴 Venció hace '+d0+(d0===1?' día':' días')+' ('+fdate(venc[0].fecha)+')';
  }
  else if(!sig||!sig.fecha){ k='sin'; due='Sin fecha compromiso'; }
  else {
    const d=dias(H,sig.fecha), q=prog?'Próximo pago '+fmt(sig.falta)+' · ':'Fecha compromiso: ';
    if(d<=DIAS_AMARILLO){ k='pv'; due='🟡 '+q+(d===0?'HOY':fshort(sig.fecha)+(d===1?' (mañana)':' (en '+d+' días)')); }
    else { k='ok'; due='🟢 '+q+fshort(sig.fecha)+' (faltan '+d+' días)'; }
  }
  return {prog,meses,interes,ahorro,total,abonado,saldo,payoff,pct,cuotas,atrasado,sig,pagadas,aCapital,fechaFin,st:{k,...SEM[k],due}};
}
function planTexto(p,c){
  const pl=p.plan||{tipo:'unico'};
  if(pl.tipo==='unico') return pl.inicio?'Pago único el '+fdate(pl.inicio):'Pago único sin fecha';
  const n=c.cuotas.length, a=c.cuotas[0]?c.cuotas[0].monto:0, z=c.cuotas[n-1]?c.cuotas[n-1].monto:0;
  return n+' pagos de '+fmt(a)+' '+FREQ[pl.tipo].cada+(n>1&&Math.abs(a-z)>0.005?' (último de '+fmt(z)+')':'');
}
function interesTexto(p){
  const i=p.interes; if(!i||i.tipo==='ninguno') return '';
  if(i.tipo==='fijo') return fmt(i.valor)+' fijo';
  return i.valor+'% '+({total:'total',mensual:'mensual',anual:'anual'})[i.tipo]+(AMORT(i.tipo)&&p.plan&&p.plan.tipo!=='unico'?' s/saldo':'');
}
const CLS={pagado:'g',capital:'cap',vencido:'r',porvencer:'y',parcial:'p',pendiente:''};
function lineaHTML(c){ return '<div class="linea">'+c.cuotas.map(q=>'<i class="'+CLS[q.e]+'"></i>').join('')+'</div>'; }
function semaforoHTML(k,big){ const l=SEM[k].l; return '<span class="tl'+(big?' big2':'')+'"><i class="r'+(l==='r'?' on':'')+'"></i><i class="y'+(l==='y'?' on':'')+'"></i><i class="g'+(l==='g'?' on':'')+'"></i></span>'; }

    const u=state.ultimoRespaldo, d=u?dias(u.slice(0,10),hoy()):null;
    if(d===null||d>=14) h+='<div class="banner"><span>💾 '+(d===null?'Aún no tienes respaldo de tus datos.':'Tu último respaldo fue hace '+d+' días.')+'</span><button id="bk">Respaldar</button></div>';
  }

  if(!ps.length) h+='<div class="empty"><div class="ic">🤝</div><h3>Aún no hay préstamos</h3><p>Toca <b>“Nuevo préstamo”</b> para registrar el primero.</p></div>';
  else if(!vis.length) h+='<div class="empty"><div class="ic">👌</div><h3>Nada en esta categoría</h3><p>Toca el filtro otra vez para ver todos.</p></div>';
  else {
    if(act.length) h+='<div class="section">Pendientes ('+act.length+')</div>'+act.map(card).join('');
    if(liq.length) h+='<div class="section">Liquidados ('+liq.length+')</div>'+liq.map(card).join('');

    ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const a=p.abonos.find(x=>x.id===b.dataset.del);
      confirmar('Se eliminará el abono de '+fmt(a.monto)+' del '+fdate(a.fecha)+'.',()=>{ p.abonos=p.abonos.filter(x=>x.id!==a.id); save('Abono eliminado'); detalle(p.id); });

  });
}

   +'<div><label>Fecha del préstamo</label><input class="in" id="ff" type="date" value="'+(p.fecha||hoy())+'"></div></div>'
   +'<div class="box"><h4>🗓 Forma de pago</h4><div class="seg" style="margin-top:10px">'+Object.keys(FREQ).map(k=>'<button type="button" data-p="'+k+'">'+(k==='unico'?'Único':FREQ[k].t)+'</button>').join('')+'</div>'
   +'<div id="pu"><label>Fecha compromiso de pago</label><input class="in" id="fc" type="date" value="'+(pl.tipo==='unico'?(pl.inicio||''):'')+'"></div>'
   +'<div id="pp"><label>Fecha del primer pago</label><input class="in" id="fi" type="date" value="'+(pl.tipo!=='unico'?(pl.inicio||''):'')+'">'
   +'<div class="two"><div><label>Monto de cada pago</label><input class="in" id="fq" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$0.00" value="'+(pl.tipo!=='unico'&&pl.cuota?pl.cuota:'')+'"></div>'
   +'<div><label>Número de pagos</label><input class="in" id="fn" type="number" inputmode="numeric" min="1" step="1" placeholder="Ej. 12" value="'+(pl.tipo!=='unico'&&pl.n?pl.n:'')+'"></div></div>'
   +'<p class="sub" style="margin-top:6px">Llena uno de los dos; el otro se calcula solo.</p></div></div>'
   +'<div class="box"><h4>％ Interés</h4><div class="seg" style="margin-top:10px">'+Object.keys(INT).map(k=>'<button type="button" data-i="'+k+'">'+INT[k].c+'</button>').join('')+'</div>'
   +'<div id="iv"><label id="ivl">Porcentaje</label><input class="in" id="fv" type="number" inputmode="decimal" min="0" step="0.01" value="'+(it.valor||'')+'"><p class="sub" id="ivn" style="margin-top:6px"></p></div></div>'
   +'<div class="prev" id="prev"></div>'
   +'<label>WhatsApp de la persona (opcional)</label><input class="in" id="ft" type="tel" inputmode="tel" placeholder="10 dígitos" value="'+esc(p.tel||'')+'">'
   +'<label>Nota (opcional)</label><textarea class="in" id="fx" rows="2" placeholder="Ej. Paga los sábados en efectivo">'+esc(p.nota||'')+'</textarea>'
   +'<div class="err" id="fe"></div><button class="btn" id="fs">'+(ed?'Guardar cambios':'Registrar préstamo')+'</button>',
  ov=>{
    const q=s=>ov.querySelector(s), v=s=>q(s).value.trim();
    function leer(){
      const monto=r2(parseFloat(v('#fm')));
      const interes={tipo:f.int,valor:f.int==='ninguno'?0:r2(parseFloat(v('#fv')))};
      let plan,error='';
      if(f.plan==='unico') plan={tipo:'unico',inicio:v('#fc')};
      else {
        let n=parseInt(v('#fn'),10), cuota=r2(parseFloat(v('#fq')));
        const am=AMORT(f.int), i=am?tasaPeriodo(f.plan,interes):0, tFlat=monto+interesDe(monto,interes,0);
        if(f.modo==='cuota'&&cuota>0&&monto>0){
          if(am){ const rows=amort(monto,i,cuota); if(rows) n=rows.length; else { n=0; error='Ese pago no alcanza a cubrir el interés. Sube el monto de cada pago.'; } }
          else n=Math.ceil(tFlat/cuota-1e-9);
        }
        if(f.modo==='n'&&n>0&&monto>0) cuota=am?cuotaFrancesa(monto,i,n):r2(Math.ceil(tFlat/n*100)/100);
        plan={tipo:f.plan,inicio:v('#fi'),n:n>0?n:0,cuota:cuota>0?cuota:0};
      }
      return {obj:{monto,fecha:v('#ff')||hoy(),interes,plan},error};
    }
    function pintar(){
      q('#pu').style.display=f.plan==='unico'?'':'none';
      q('#pp').style.display=f.plan==='unico'?'none':'';
      q('#iv').style.display=f.int==='ninguno'?'none':'';
      q('#ivl').textContent=f.int==='fijo'?'Cantidad de interés ($)':f.int==='mensual'?'Porcentaje mensual (%)':f.int==='anual'?'Porcentaje anual (%)':'Porcentaje total (%)';
      q('#fv').placeholder=f.int==='fijo'?'$0.00':'Ej. 5';
      q('#ivn').textContent=AMORT(f.int)?'Se cobra sobre el saldo que va quedando (como banco). Si abona de más, el interés baja.':'Se reparte en partes iguales en cada pago. Si abona de más, el interés de los pagos adelantados desaparece.';
      ov.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===f.plan));
      ov.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',b.dataset.i===f.int));
      const {obj,error}=leer(), pr=q('#prev');
      if(f.plan!=='unico'){
        if(f.modo==='cuota'&&document.activeElement!==q('#fn')) q('#fn').value=obj.plan.n||'';
        if(f.modo==='n'&&document.activeElement!==q('#fq')) q('#fq').value=obj.plan.cuota||'';
      }
      if(error){ pr.className='prev bad'; pr.innerHTML=error; return; }
      if(!(obj.monto>0)){ pr.className='prev'; pr.innerHTML='Escribe el monto para ver el resumen.'; return; }
      const c=calc({...obj,abonos:[]});
      let s='';
      if(c.interes) s+='Interés: <b style="color:var(--pur)">'+fmt(c.interes)+'</b>'+(AMORT(f.int)?(f.plan==='unico'?' <span class="sub">('+(obj.interes.valor||0)+'% '+(f.int==='anual'?'anual':'mensual')+' × '+(Math.round(c.meses*10)/10)+' meses'+(f.int==='anual'?' ÷ 12':'')+')</span>':' <span class="sub">(sobre saldo, pagando puntual)</span>'):'')+'<br>';
      s+='Total a pagar: <b>'+fmt(c.total)+'</b>';
      if(f.plan!=='unico'&&obj.plan.n>0){
        const last=c.cuotas[c.cuotas.length-1];
        s+='<br>'+c.cuotas.length+' pagos de <b>'+fmt(c.cuotas[0].monto)+'</b> '+FREQ[f.plan].cada+(c.cuotas.length>1&&Math.abs(last.monto-c.cuotas[0].monto)>0.005?' (último de '+fmt(last.monto)+')':'');
        if(obj.plan.inicio) s+='<br>Del '+fdate(c.cuotas[0].fecha)+' al '+fdate(last.fecha);
      }
      pr.className='prev'; pr.innerHTML=s;
    }
    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{f.plan=b.dataset.p;pintar();});
    ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{f.int=b.dataset.i;pintar();});
    q('#fn').addEventListener('input',()=>{f.modo='n';pintar();});
    q('#fq').addEventListener('input',()=>{f.modo='cuota';pintar();});
    ['#fm','#fv','#fi','#ff','#fc'].forEach(s=>q(s).addEventListener('input',pintar));
    pintar();
    q('#fs').onclick=()=>{
      const persona=v('#fp'), {obj,error}=leer(), E=t=>{q('#fe').textContent=t;};
      if(!persona) return E('Escribe el nombre de la persona.');
      if(!(obj.monto>0)) return E('Escribe un monto prestado mayor a 0.');
      if(f.int!=='ninguno'&&!(obj.interes.valor>0)) return E('Escribe el valor del interés o elige “Ninguno”.');
      if(error) return E(error);
      if(f.plan!=='unico'){
        if(!obj.plan.inicio) return E('Elige la fecha del primer pago.');
        if(!(obj.plan.n>0)) return E('Escribe el monto de cada pago o el número de pagos.');
      }
      const data={persona,...obj,concepto:v('#fo'),tel:v('#ft').replace(/\D/g,''),nota:v('#fx')};
      if(ed) Object.assign(state.prestamos.find(x=>x.id===p.id),data);
      else state.prestamos.push({id:uid(),abonos:[],...data});
      closeModal(); save(ed?'Cambios guardados ✓':'Préstamo registrado ✓');
    };
  });
}

function formAbono(p){
  const c=calc(p);
  const sug=c.atrasado>0?c.atrasado:(c.sig?c.sig.falta:c.saldo);
  modal('<button class="x" data-close>✕</button><h2>Abono de '+esc(p.persona)+'</h2>'
   +'<p class="p">Saldo actual: <b style="color:var(--ink)">'+fmt(c.saldo)+'</b>'+(c.atrasado>0?'<br>Atrasado: <b style="color:var(--r)">'+fmt(c.atrasado)+'</b>':'')+'</p>'
   +'<label>Monto del abono</label><input class="in" id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$0.00">'
   +'<div class="chips" style="padding:8px 0 0">'
   +(c.prog&&sug>0&&sug<c.payoff?'<button class="chip" data-v="'+sug+'">'+(c.atrasado>0?'Ponerse al corriente':'Pago pactado')+' ('+fmt(sug)+')</button>':'')
   +'<button class="chip" data-v="'+c.payoff+'">Liquidar todo ('+fmt(c.payoff)+')</button></div>'
   +'<label>Fecha</label><input class="in" id="af" type="date" value="'+hoy()+'">'
   +'<label>Nota (opcional)</label><input class="in" id="an" placeholder="Ej. Efectivo / transferencia">'
   +(c.prog?'<div class="note">💡 Lo que pase del pago pactado (más lo atrasado, si hay) se abona a <b>capital</b> de los últimos pagos: su interés desaparece y el préstamo termina antes, sin cambiar el pago de cada '+FREQ[p.plan.tipo].per+'.</div>':'')
   +'<div class="err" id="ae"></div><button class="btn gold" id="as">Guardar abono</button>',
  ov=>{
    const q=s=>ov.querySelector(s);
    ov.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>q('#am').value=b.dataset.v);
    q('#as').onclick=()=>{
      const m=r2(parseFloat(q('#am').value));
      if(!(m>0)) return q('#ae').textContent='Escribe un monto mayor a 0.';
      if(m>c.payoff+0.001) return q('#ae').textContent='Para liquidar todo bastan '+fmt(c.payoff)+'.';
      p.abonos=p.abonos||[]; p.abonos.push({id:uid(),monto:m,fecha:q('#af').value||hoy(),nota:q('#an').value.trim()});
      save(calc(p).saldo<=0?'🎉 ¡Préstamo liquidado!':'Abono registrado ✓'); detalle(p.id);
    };
  });
}

/* ============ COMPARTIR: TEXTO WHATSAPP ============ */
function textoResumen(p,c){
  const L=['Hola '+nombre1(p.persona)+' 👋, este es el estatus de tu préstamo'+(p.concepto?' ('+p.concepto+')':'')+':','',
    (c.st.k==='ven'?'🔴':c.st.k==='pv'?'🟡':c.st.k==='sin'?'⚪':'🟢')+' Estatus: '+c.st.t.toUpperCase(),
    '💵 Prestado: '+fmt(p.monto)+' ('+fdate(p.fecha)+')'];
  if(c.interes) L.push('％ Interés ('+interesTexto(p)+'): '+fmt(c.interes),'🧾 Total a pagar: '+fmt(c.total));
  L.push('🗓 Acuerdo: '+planTexto(p,c));
  L.push('✅ Abonado: '+fmt(c.abonado)+((p.abonos||[]).length?' ('+p.abonos.length+(p.abonos.length===1?' abono)':' abonos)'):''));
  L.push('📌 Saldo pendiente: '+fmt(c.saldo));
  if(c.saldo>0){
    if(c.atrasado>0) L.push('⚠️ Atrasado: '+fmt(c.atrasado));
    if(c.sig&&c.sig.fecha) L.push('📅 '+(c.prog?'Próximo pago: '+fmt(c.sig.falta)+' el ':'Fecha compromiso: ')+fdate(c.sig.fecha));
    if(c.aCapital>0.005) L.push('💪 Abonos extra a capital: '+fmt(c.aCapital)+(c.fechaFin?' (terminas el '+fdate(c.fechaFin)+')':''));
    if(c.ahorro>0.005) L.push('🎁 Interés que te ahorraste: '+fmt(c.ahorro));
    L.push('','¡Gracias!');
  } else L.push('','🎉 ¡Préstamo liquidado! Muchas gracias.');
  return L.join('\n');
}
function compartirTexto(p){
  const c=calc(p), txt=textoResumen(p,c);
  const tel=p.tel?(p.tel.length===10?'52'+p.tel:p.tel):'';
  modal('<button class="x" data-close>✕</button><h2>Mensaje para '+esc(nombre1(p.persona))+'</h2><div class="share">'+esc(txt)+'</div>'

   });
}

/* ============ COMPARTIR: IMAGEN ============ */
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrap(x,text,X,Y,maxW,lh){
  const words=text.split(' '); let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW&&line){ x.fillText(line,X,Y); Y+=lh; line=w; } else line=t; }
  if(line){ x.fillText(line,X,Y); Y+=lh; } return Y;
}
function dibujar(p){
  const c=calc(p), S=SEM[c.st.k], W=1080, P=60;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=4200; const x=cv.getContext('2d');
  x.fillStyle='#f2f4f8'; x.fillRect(0,0,W,4200);
  // encabezado
  const g=x.createLinearGradient(0,0,W,320); g.addColorStop(0,'#123c52'); g.addColorStop(1,'#1d6a7a');
  x.fillStyle=g; x.fillRect(0,0,W,330);
  x.fillStyle='rgba(255,255,255,.75)'; x.font='700 30px '+FONT; x.fillText('ESTADO DE TU PRÉSTAMO',P,90);
  x.fillStyle='#fff'; x.font='800 76px '+FONT; x.fillText(p.persona.length>20?p.persona.slice(0,19)+'…':p.persona,P,180);
  x.fillStyle='rgba(255,255,255,.85)'; x.font='500 32px '+FONT;
  x.fillText((p.concepto?p.concepto+' · ':'')+'Prestado el '+fdate(p.fecha),P,236);
  x.fillText('Actualizado al '+fdate(hoy()),P,284);
  let y=360;
  // semáforo
  rr(x,P,y,W-2*P,230,28); x.fillStyle='#fff'; x.fill();
  rr(x,P+34,y+60,330,110,55); x.fillStyle='#1d2433'; x.fill();
  [['r','#e03131'],['y','#f2b705'],['g','#1f9d55']].forEach(([l,col],i)=>{
    x.beginPath(); x.arc(P+34+65+i*100,y+115,38,0,Math.PI*2); x.fillStyle=col; x.globalAlpha=S.l===l?1:.2;
    if(S.l===l){ x.shadowColor=col; x.shadowBlur=30; } x.fill(); x.shadowBlur=0; x.globalAlpha=1;
  });
  x.fillStyle=S.hex; x.font='800 54px '+FONT; x.fillText(S.t,P+400,y+100);
  x.fillStyle='#14213d'; x.font='600 30px '+FONT;
  wrap(x,c.st.due.replace(/^[🟢🟡🔴✅]\s?/u,''),P+400,y+148,W-2*P-430,38);
  y+=260;
  // montos
  const items=[['Prestado',fmt(p.monto),'#14213d']];
  if(c.interes){ items.push(['Interés ('+interesTexto(p)+')',fmt(c.interes),'#7a4fd6']); items.push(['Total a pagar',fmt(c.total),'#14213d']); }
  items.push(['Abonado',fmt(c.abonado),'#1f9d55'],['Saldo pendiente',fmt(c.saldo),S.hex]);
  if(c.atrasado>0) items.push(['Atrasado',fmt(c.atrasado),'#e03131']);
  if(c.aCapital>0.005) items.push(['Extra a capital',fmt(c.aCapital),'#7a4fd6']);
  if(c.ahorro>0.005) items.push(['Interés ahorrado',fmt(c.ahorro),'#1f9d55']);
  const bw=(W-2*P-20)/2;
  items.forEach((it,i)=>{
    const X=P+(i%2)*(bw+20), Y=y+Math.floor(i/2)*150;
    rr(x,X,Y,bw,130,24); x.fillStyle='#fff'; x.fill();
    x.fillStyle='#6b7488'; x.font='700 26px '+FONT; x.fillText(it[0].toUpperCase(),X+28,Y+48);
    x.fillStyle=it[2]; x.font='800 46px '+FONT; x.fillText(it[1],X+28,Y+104);
  });
  y+=Math.ceil(items.length/2)*150+20;
  // avance
  x.fillStyle='#14213d'; x.font='700 30px '+FONT; x.fillText('Avance: '+c.pct.toFixed(0)+'% pagado',P,y+30);
  rr(x,P,y+50,W-2*P,28,14); x.fillStyle='#e4e8ef'; x.fill();
  if(c.pct>0){ rr(x,P,y+50,Math.max(28,(W-2*P)*c.pct/100),28,14); x.fillStyle=S.hex; x.fill(); }
  y+=120;
  // línea de cumplimiento
  if(c.prog){
    x.fillStyle='#14213d'; x.font='700 30px '+FONT; x.fillText('Línea de cumplimiento · '+c.pagadas+' de '+c.cuotas.length+' pagos',P,y+30);
    y+=56;
    const per=Math.min(12,c.cuotas.length), gap=12, cell=(W-2*P-gap*(per-1))/per, ch=Math.min(cell,74);
    const COL={pagado:['#1f9d55','#fff'],capital:['#7a4fd6','#fff'],vencido:['#e03131','#fff'],porvencer:['#f2b705','#14213d'],parcial:['#c9d1de','#14213d'],pendiente:['#e4e8ef','#6b7488']};
    c.cuotas.forEach((q,i)=>{
      const X=P+(i%per)*(cell+gap), Y=y+Math.floor(i/per)*(ch+gap);
      rr(x,X,Y,cell,ch,14); x.fillStyle=COL[q.e][0]; x.fill();
      x.fillStyle=COL[q.e][1]; x.font='800 '+Math.round(ch*0.36)+'px '+FONT; x.textAlign='center';
      x.fillText(q.e==='pagado'?'✓':String(q.n),X+cell/2,Y+ch*0.63); x.textAlign='left';
    });
    y+=Math.ceil(c.cuotas.length/per)*(ch+gap)+14;
    let lx=P; x.font='600 25px '+FONT;
    [['#1f9d55','Pagado'],['#f2b705','Por vencer'],['#e03131','Vencido'],['#e4e8ef','Pendiente']].concat(c.aCapital>0.005?[['#7a4fd6','Extra a capital']]:[]).forEach(([col,t])=>{
      rr(x,lx,y,26,26,7); x.fillStyle=col; x.fill(); x.fillStyle='#6b7488'; x.fillText(t,lx+36,y+22); lx+=36+x.measureText(t).width+30;
    });
    y+=60;
  }
  // próximo pago
  if(c.saldo>0&&c.sig&&c.sig.fecha){
    rr(x,P,y,W-2*P,170,28); x.fillStyle=S.hexbg; x.fill();
    x.fillStyle='#6b7488'; x.font='700 28px '+FONT; x.fillText(c.prog?'PRÓXIMO PAGO':'FECHA COMPROMISO',P+34,y+56);
    x.fillStyle=S.hex; x.font='800 60px '+FONT; x.fillText(fmt(c.prog?c.sig.falta:c.saldo),P+34,y+130);
    x.fillStyle='#14213d'; x.font='700 36px '+FONT; x.textAlign='right'; x.fillText(fdate(c.sig.fecha),W-P-34,y+122); x.textAlign='left';
    y+=200;
    if(c.prog&&c.fechaFin){ x.fillStyle='#6b7488'; x.font='600 28px '+FONT; x.fillText('🏁 Terminaría el '+fdate(c.fechaFin)+(c.aCapital>0.005?' gracias a tus abonos extra 💪':''),P,y+10); y+=50; }
  } else if(c.saldo<=0){
    rr(x,P,y,W-2*P,150,28); x.fillStyle='#e2f5ea'; x.fill();
    x.fillStyle='#1f9d55'; x.font='800 52px '+FONT; x.textAlign='center'; x.fillText('🎉 ¡Préstamo liquidado!',W/2,y+92); x.textAlign='left';
    y+=180;
  }
  x.fillStyle='#14213d'; x.font='700 34px '+FONT; x.textAlign='center'; x.fillText(c.st.k==='ven'?'Te pedimos ponerte al corriente 🙏':'¡Gracias por tu cumplimiento! 🙏',W/2,y+50); x.textAlign='left';
  y+=100;
  const out=document.createElement('canvas'); out.width=W; out.height=y; out.getContext('2d').drawImage(cv,0,0); return out;
}
function compartirImagen(p){
  let cv; try{ cv=dibujar(p); }catch(e){ return toast('No se pudo crear la imagen'); }
  const url=cv.toDataURL('image/png');
  const name='Prestamo-'+nombre1(p.persona).replace(/[^\wÀ-ÿ]/g,'')+'-'+hoy()+'.png';
  let file=null;
  cv.toBlob(b=>{ if(b) try{ file=new File([b],name,{type:'image/png'}); }catch(e){} },'image/png');
  modal('<button class="x" data-close>✕</button><h2>Imagen para '+esc(nombre1(p.persona))+'</h2><img class="imgprev" src="'+url+'" alt="Estado del préstamo">'
   +'<button class="btn wa" id="sh">📤 Compartir imagen</button><a class="btn alt" id="dl" href="'+url+'" download="'+esc(name)+'">⬇️ Guardar imagen</a>'
   +'<p class="sub" style="text-align:center;margin-top:10px">En iPhone también puedes mantener presionada la imagen → “Guardar en Fotos”.</p>',

  });
}

   +'<p class="p">Tus datos se guardan <b>solo en este celular</b>: sin cuentas, sin internet y sin costo. Si borras los datos del navegador o cambias de teléfono se pierden, así que <b>descarga un respaldo</b> de vez en cuando y guárdalo en tu correo, Drive o WhatsApp.</p>'
   +'<p class="p" style="margin-top:10px">Último respaldo: <b style="color:var(--ink)">'+(u?fdate(u.slice(0,10)):'nunca')+'</b></p>'
   +'<button class="btn" id="exp">⬇️ Descargar respaldo</button>'
   +'<button class="btn alt" id="imp">⬆️ Restaurar desde respaldo</button><input type="file" id="file" accept=".json,application/json,text/plain" style="display:none">'
   +'<p class="sub" style="margin-top:16px;text-align:center">🚦 Control de Préstamos · Amarillo: '+DIAS_AMARILLO+' días antes del pago</p>',
  ov=>{
    const q=s=>ov.querySelector(s);
    q('#exp').onclick=()=>{
      state.ultimoRespaldo=new Date().toISOString(); persist();
      const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
      const name='prestamos-respaldo-'+hoy()+'.json';
      try{ const f=new File([blob],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:name}).catch(()=>{}); render(); return; } }catch(e){}
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); toast('Respaldo descargado ✓'); render();
    };
    q('#imp').onclick=()=>q('#file').click();
    q('#file').onchange=e=>{
      const file=e.target.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onload=()=>{
        let o; try{ o=JSON.parse(rd.result); }catch(x){ return toast('Ese archivo no es un respaldo válido'); }
        if(!o||!Array.isArray(o.prestamos)) return toast('Ese archivo no es un respaldo válido');
        confirmar('Se reemplazarán los datos actuales por los del respaldo ('+o.prestamos.length+' préstamos).',()=>{ state=o; save('Respaldo restaurado ✓'); },'Sí, restaurar');
      };
      rd.readAsText(file);
    };
  });
}

render();
})();
</script>
</body>
</html>
